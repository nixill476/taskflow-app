<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TaskFlow - Personal Dashboard</title>
<style>
:root{--bg:#0b1020;--panel:#141c30;--panel2:#1b2740;--text:#f1f5ff;--muted:#9aa8c2;--accent:#7c83ff;--green:#39dba1;--red:#ff7185}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{padding:25px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #26324b}
.logo{font-size:25px;font-weight:bold;color:#a5a8ff}
header span{color:var(--muted);font-size:13px}
main{max-width:1100px;margin:30px auto;padding:0 20px}
h1{font-size:30px;margin-bottom:8px}
.sub{color:var(--muted);margin-bottom:25px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:25px}
.card,.panel{background:var(--panel);padding:20px;border-radius:15px;border:1px solid #26324b}
.stat-number{font-size:30px;font-weight:bold;margin-top:12px}
.muted{color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:1fr 1.5fr;gap:20px}
input,select{width:100%;padding:13px;margin:8px 0;background:var(--panel2);color:white;border:1px solid #34415d;border-radius:9px}
button{padding:11px 15px;border:0;border-radius:9px;background:var(--accent);color:white;font-weight:bold;cursor:pointer}
button:hover{opacity:.85}
.add{width:100%;margin-top:8px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
.filters button{background:var(--panel2);font-size:12px}
.filters button.active{background:var(--accent)}
.task{background:var(--panel2);padding:14px;border-radius:11px;margin:10px 0;display:flex;gap:12px;align-items:center}
.task input[type=checkbox]{width:19px;height:19px;accent-color:var(--green)}
.task-content{flex:1;min-width:0}
.task-title{font-weight:bold;overflow-wrap:anywhere}
.task.done .task-title{text-decoration:line-through;color:var(--muted)}
.task-meta{font-size:12px;color:var(--muted);margin-top:7px}
.priority{font-size:11px;padding:4px 7px;border-radius:5px;background:#35405b}
.High{color:#ff8494}.Medium{color:#ffc66d}.Low{color:#54dfb0}
.actions{display:flex;gap:5px}
.actions button{padding:7px;font-size:11px;background:#35405b}
.empty{text-align:center;color:var(--muted);padding:35px}
.progress{height:9px;background:#29334b;border-radius:10px;margin-top:15px;overflow:hidden}
.progress div{height:100%;background:var(--green);width:0%;transition:.3s}
#taskCount{margin-bottom:10px}
footer{text-align:center;padding:30px;color:var(--muted);font-size:12px}
@media(max-width:700px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}.stat-number{font-size:22px}header{padding:20px}}
</style>
</head>
<body>
<header>
 <div class="logo">✦ TaskFlow</div>
 <span>YOUR PERSONAL PRODUCTIVITY SPACE</span>
</header>
<main>
 <h1 id="greeting">Good day!</h1>
 <div class="sub" id="today"></div>

 <div class="stats">
  <div class="card"><div class="muted">TOTAL TASKS</div><div class="stat-number" id="total">0</div></div>
  <div class="card"><div class="muted">COMPLETED</div><div class="stat-number" id="completed">0</div></div>
  <div class="card"><div class="muted">REMAINING</div><div class="stat-number" id="remaining">0</div></div>
 </div>

 <div class="panel" style="margin-bottom:20px">
  <b>Daily progress</b>
  <div class="progress"><div id="bar"></div></div>
  <div class="muted" id="percent" style="margin-top:9px">0% completed</div>
 </div>

 <div class="layout">
  <section class="panel">
   <h2 id="formHeading">＋ Add a task</h2>
   <form id="taskForm">
    <input id="taskName" placeholder="What do you need to do?" required maxlength="100">
    <select id="category">
     <option>Study</option><option>Assignment</option><option>Gym</option><option>Personal</option><option>Other</option>
    </select>
    <select id="priority">
     <option>High</option><option selected>Medium</option><option>Low</option>
    </select>
    <label class="muted">Due date</label>
    <input type="date" id="dueDate">
    <button class="add" id="saveButton">＋ Add Task</button>
    <button type="button" id="cancelEdit" class="add" style="display:none;background:#35405b">Cancel edit</button>
   </form>
  </section>

  <section class="panel">
   <h2>My tasks</h2>
   <div class="filters">
    <button class="active" data-filter="All">All</button>
    <button data-filter="Pending">Pending</button>
    <button data-filter="Completed">Completed</button>
   </div>
   <div id="taskCount" class="muted"></div>
   <div id="taskList"></div>
  </section>
 </div>
</main>
<footer>TaskFlow · Plan better. Focus better. Achieve more.</footer>

<script>
const $=id=>document.getElementById(id);
let tasks=JSON.parse(localStorage.getItem("taskflow_tasks")||"[]");
let filter="All", editing=null;

function save(){
 localStorage.setItem("taskflow_tasks",JSON.stringify(tasks));
 render();
}
function dateToday(){
 const d=new Date();
 return d.toLocaleDateString("en-IN",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
}
$("today").textContent=dateToday();
const hour=new Date().getHours();
$("greeting").textContent=hour<12?"Good morning!":hour<17?"Good afternoon!":"Good evening!";

$("taskForm").addEventListener("submit",e=>{
 e.preventDefault();
 const name=$("taskName").value.trim();
 if(!name)return;
 const data={
  title:name,category:$("category").value,
  priority:$("priority").value,due:$("dueDate").value
 };
 if(editing!==null){
  tasks=tasks.map(t=>t.id===editing?{...t,...data}:t);
  editing=null;
 }else{
  tasks.unshift({id:Date.now(),...data,done:false});
 }
 $("taskForm").reset();
 $("formHeading").textContent="＋ Add a task";
 $("saveButton").textContent="＋ Add Task";
 $("cancelEdit").style.display="none";
 save();
});

function editTask(id){
 const t=tasks.find(x=>x.id===id);
 if(!t)return;
 editing=id;
 $("taskName").value=t.title;
 $("category").value=t.category;
 $("priority").value=t.priority;
 $("dueDate").value=t.due;
 $("formHeading").textContent="Edit task";
 $("saveButton").textContent="Save changes";
 $("cancelEdit").style.display="block";
 $("taskName").focus();
}
$("cancelEdit").onclick=()=>{
 editing=null;
 $("taskForm").reset();
 $("formHeading").textContent="＋ Add a task";
 $("saveButton").textContent="＋ Add Task";
 $("cancelEdit").style.display="none";
};

function toggleTask(id){
 tasks=tasks.map(t=>t.id===id?{...t,done:!t.done}:t);
 save();
}
function deleteTask(id){
 if(!confirm("Delete this task?"))return;
 tasks=tasks.filter(t=>t.id!==id);
 save();
}
function render(){
 const done=tasks.filter(t=>t.done).length;
 const total=tasks.length;
 const pct=total?Math.round(done/total*100):0;
 $("total").textContent=total;
 $("completed").textContent=done;
 $("remaining").textContent=total-done;
 $("bar").style.width=pct+"%";
 $("percent").textContent=pct+"% completed";
 const visible=tasks.filter(t=>filter==="All"||(filter==="Pending"?!t.done:t.done));
 $("taskCount").textContent=visible.length+" tasks shown";
 $("taskList").innerHTML="";
 if(!visible.length){
  $("taskList").innerHTML='<div class="empty">No tasks here yet. Add one to get started! ✨</div>';
  return;
 }
 visible.forEach(t=>{
  const div=document.createElement("div");
  div.className="task"+(t.done?" done":"");
  const check=document.createElement("input");
  check.type="checkbox";check.checked=t.done;
  check.addEventListener("change",()=>toggleTask(t.id));
  const content=document.createElement("div");
  content.className="task-content";
  const title=document.createElement("div");
  title.className="task-title";title.textContent=t.title;
  const meta=document.createElement("div");
  meta.className="task-meta";
  meta.textContent=t.category+" · "+(t.due||"No deadline")+" · ";
  const priority=document.createElement("span");
  priority.className="priority "+t.priority;
  priority.textContent=t.priority+" priority";
  meta.appendChild(priority);
  content.append(title,meta);
  const actions=document.createElement("div");
  actions.className="actions";
  const edit=document.createElement("button");
  edit.textContent="Edit";edit.onclick=()=>editTask(t.id);
  const del=document.createElement("button");
  del.textContent="✕";del.onclick=()=>deleteTask(t.id);
  actions.append(edit,del);
  div.append(check,content,actions);
  $("taskList").appendChild(div);
 });
}
document.querySelectorAll("[data-filter]").forEach(btn=>{
 btn.onclick=()=>{
  filter=btn.dataset.filter;
  document.querySelectorAll("[data-filter]").forEach(b=>b.classList.toggle("active",b===btn));
  render();
 };
});
render();
</script>
 <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("TaskFlow offline mode ready"))
      .catch(error => console.error("Service worker error:", error));
  });
}
</script>
</body>
</html>
